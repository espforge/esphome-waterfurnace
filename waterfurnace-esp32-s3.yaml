substitutions:
  name: waterfurnace
  friendly_name: "WaterFurnace Aurora"
  component_source: github://espforge/esphome-waterfurnace@main
  uart_tx_pin: GPIO17
  uart_rx_pin: GPIO18
  flow_control_pin: GPIO21

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: espforge.waterfurnace
    version: "0.1.0-beta"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

logger:

api:
  custom_services: true

web_server:
  version: 3
  local: true

ota:
  - platform: esphome
    id: ota_esphome
  - platform: web_server

wifi:
  ap:
    ssid: "${name} Setup"

# Fallback Wi-Fi hotspot with a captive portal: if the device can't join the
# configured network it raises "<name> Setup"; joining it from a phone opens a
# page to pick a network and save credentials to flash.
captive_portal:

# Improv BLE provisioning: the Home Assistant companion app (or any Improv
# client, e.g. https://www.improv-wifi.com) detects the device over Bluetooth
# and can send Wi-Fi credentials to it -- no hotspot or USB cable needed.
# Comment this out if you need the ~370 KB of flash back.
esp32_improv:
  authorizer: none

packages:
  waterfurnace_aurora: !include waterfurnace_aurora.yaml

