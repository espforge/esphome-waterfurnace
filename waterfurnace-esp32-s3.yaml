substitutions:
  name: waterfurnace
  friendly_name: "WaterFurnace Aurora"
  component_source: github://espforge/esphome-waterfurnace@main
  uart_tx_pin: GPIO17
  uart_rx_pin: GPIO18
  flow_control_pin: GPIO21

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: espforge.waterfurnace
    version: "0.1.0-beta"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

logger:

api:
  custom_services: true

web_server:
  version: 3
  local: true

ota:
  - platform: esphome
    id: ota_esphome
  - platform: web_server

wifi:

packages:
  waterfurnace_aurora: !include waterfurnace_aurora.yaml

